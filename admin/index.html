<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/icon.svg"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var h = window.location.hostname;
        var isLocal =
          h === 'localhost' ||
          h === '127.0.0.1' ||
          h.startsWith('192.168.') ||
          h.endsWith('.local');
        if (!isLocal && h !== 'admin.uithings.site') {
          window.location.replace(
            'https://admin.uithings.site' +
              window.location.pathname +
              window.location.search +
              window.location.hash
          );
        }
      })();
    </script>

    <!-- Primary Meta Tags -->
    <title>uithings Team</title>
    <meta name="title" content="uithings Team" />
    <meta
      name="description"
      content="Admin Dashboard UI built with Shadcn and Vite."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://admin.uithings.site" />
    <meta property="og:title" content="uithings Admin" />
    <meta
      property="og:description"
      content="Admin Dashboard UI for uithings."
    />
    <meta
      property="og:image"
      content="https://admin.uithings.site/images/icon.svg"
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://admin.uithings.site" />
    <meta property="twitter:title" content="uithings Admin" />
    <meta
      property="twitter:description"
      content="Admin Dashboard UI for uithings."
    />
    <meta
      property="twitter:image"
      content="https://admin.uithings.site/images/icon.svg"
    />

    <!-- font family -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />

    <meta name="theme-color" content="#fff" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
